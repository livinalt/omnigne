[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/omnigne-runner"]
exclude = ["contracts/stellar"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
omnigne-core = { path = "crates/omnigne-core" }
omnigne-risk = { path = "crates/omnigne-risk" }
omnigne-storage = { path = "crates/omnigne-storage" }
omnigne-stellar = { path = "crates/omnigne-stellar" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

